name: test

on:
  push:
  pull_request:

env:
  FOUNDRY_PROFILE: default

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Build
        run: forge build --sizes

      - name: Format
        run: forge fmt --check

      - name: Test
        run: forge test -vvv

      - name: Gas snapshot
        run: forge snapshot --check || true
